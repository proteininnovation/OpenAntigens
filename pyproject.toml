[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agdesign2"
version = "0.1.0"
description = "Portal and data-retrieval toolkit for antigen construct design across secreted and membrane proteins"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.8",
  "freesasa>=2.2",
  "biopython>=1.84",
  "pyarrow>=15",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["httpx>=0.28"]
performance = [
  "parasail>=1.3",
]

[project.scripts]
agdesign2 = "agdesign2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agdesign2 = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
